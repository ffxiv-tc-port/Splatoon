When the game tells you that ability A has distance D,\nin fact it means that you are allowed to execute\nability A if distance between edge of your hitbox\nand enemy's hitbox is less or equal than distance D,\nthat is for targeted abilities.\nIf an ability is AoE, such check is performed between\nmiddle point of your character and edge of enemy's hitbox.\n\nSummary: if you are trying to make targeted ability indicator -\nenable both "+your hitbox" and "+target hitbox".\nIf you are trying to make AoE ability indicator - \nenable only "+target hitbox" to make indicators valid.==當遊戲顯示技能A的距離為D時,\n對於指向性技能而言,實際意義是:\n只要你的hitbox邊緣與敵人hitbox邊緣之間的距離\n小於或等於D,即可使用技能A。\n如果是AoE技能,則以你角色的中心點\n與敵人hitbox邊緣之間進行判定。\n\n總結:若要製作指向性技能的指示器,\n請同時啟用「+你的hitbox」和「+目標hitbox」。\n若要製作AoE技能的指示器,\n請僅啟用「+目標hitbox」以確保指示正確。
