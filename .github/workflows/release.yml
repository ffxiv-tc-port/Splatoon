name: Release

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\xivlauncher\Addon\Hooks\dev\"
      - name: Compute version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v'
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      # 刻意只建外掛專案,不建整個方案。
      #
      # SplatoonScriptsOfficial(246 支腳本)在方案裡,但它「不是」外掛的相依 ——
      # 相依方向是反的(腳本專案參照 Splatoon,不是 Splatoon 參照腳本),
      # 而且腳本根本不隨外掛出貨,是使用者執行期自己下載編譯的。
      # 建方案等於讓「任何一支腳本編不過就發不出版」,而腳本壞掉本來就不該擋外掛出貨。
      #
      # 腳本的編譯期把關沒有被拿掉,只是移到 build-check(那邊照樣建整個方案)。
      # 分工:腳本編不過 → build-check 紅;外掛編不過 → release 紅。
      #
      # ⚠️ 不要改成建方案再加 continue-on-error —— 那會把真正的外掛建置失敗一起吞掉。
      # 這裡的解耦是精準的:ECommons / NightmareUI / Pictomancy / FFXIVClientStructs
      # 都是 Splatoon.csproj 的 ProjectReference,它們壞掉一樣會讓發版失敗。
      #
      # -p:Platform=x64 對應方案裡 Release|Any CPU → Release|x64 的映射,
      # 輸出路徑不受影響(csproj 寫死 OutputPath=bin\$(Configuration)\)。
      # 已實測:同一支腳本故意寫壞時,建方案 exit 1、建這個 csproj exit 0,
      # 且 Splatoon/bin/Release 產出的 41 個檔案與建方案時完全一致。
      - name: Build with dotnet
        run: dotnet build Splatoon/Splatoon.csproj --configuration Release -p:Platform=x64 -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest
        shell: pwsh
        run: |
          $path = './Splatoon/bin/Release/Splatoon.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Archive
        run: Compress-Archive -Path Splatoon/bin/Release/* -DestinationPath Splatoon.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            Splatoon.zip
            Splatoon/bin/Release/Splatoon.json
          generate_release_notes: true
